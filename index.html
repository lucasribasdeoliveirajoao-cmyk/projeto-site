<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedor Range Rover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1115;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background-color: #1a1d24;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid #c5a880;
        }
        header h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
        }
        nav {
            background-color: #000000;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
        }
        nav a {
            color: #c5a880;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #c5a880;
        }
        main {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .destaque {
            font-size: 1.8rem;
            font-weight: 700;
            color: #c5a880;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .container-foto {
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a2f3a;
        }
        .container-foto img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .container-foto img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <header>
        <h1>Fornecedor Range Rover</h1>
    </header>

    <nav>
        <a href="#">INICIAL</a>
        <a href="#">COLABORADORES</a>
        <a href="#">TELEFONE</a>
    </nav>

    <main>
        <p class="destaque">Range Rovers em Promoção!</p>
        <div class="container-foto">
            <img src="rangerover.jpeg" alt="Range Rover">
        </div>
    </main>

</body>
</html>
